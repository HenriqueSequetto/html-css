<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url('fontes/Cherish Free.otf') format('opentype'), url('fontes/Cherish Free.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /* 
                Tipos de formato()
                - opentype (otf)
                -truetype (ttf)
                - embedded-opentype
                - truetype-att (Apple Advanced Typography)
                -svg
            */

        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'Love', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Corrupti quae sapiente odit. Porro quis eveniet autem, nemo similique, laborum consectetur non distinctio doloribus repudiandae sapiente. At nihil in animi officia!</p>

</body>
</html>
